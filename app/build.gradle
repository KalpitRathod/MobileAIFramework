plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def geminiApiKey = localProps.getProperty('GEMINI_API_KEY', System.getenv('GEMINI_API_KEY') ?: '')

android {
    namespace 'com.phoneai.localmodel'
    compileSdk 34

    defaultConfig {
        applicationId "com.phoneai.localmodel"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        buildConfigField "String", "GEMINI_API_KEY", "\"${geminiApiKey}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

configurations.all {
    resolutionStrategy {
        force 'androidx.core:core:1.12.0'
        force 'androidx.core:core-ktx:1.12.0'
    }
}

dependencies {
    // AndroidX & UI
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Coroutines & Lifecycle
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Native llama.cpp GGUF runner for compact 200MB - 300MB models (SmolLM2 360M, Qwen2.5 0.5B, etc.)
    implementation 'dev.ffmpegkit-maintained:llama-android:0.1.1'

    // Google MediaPipe Tasks GenAI for On-Device LLM Inference
    implementation 'com.google.mediapipe:tasks-genai:0.10.14'

    // On-Device Bundled ML Kit Text Recognition (OCR) - 100% Offline, no Google Play Services download needed
    implementation 'com.google.mlkit:text-recognition:16.0.0'

    // High performance networking for external cloud AI APIs (Gemini, Claude, OpenAI, Mistral, etc.)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Unit Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
}
